name: Android MVP
on: [push, pull_request, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          # The retired "tools" package is no longer available from sdkmanager.
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - run: chmod +x gradlew
      - run: ./gradlew :elm:test :obd:test :trip:test :traffic:test :connection:testDebugUnitTest :auto:testDebugUnitTest :auto-media:testDebugUnitTest :app:lintPhoneDebug :app:lintUnsupportedDebug :app:lintMediaDebug :app:assemblePhoneDebug :app:assembleUnsupportedDebug :app:assembleMediaDebug :app:assemblePhoneRelease
      - name: Verify phone / Auto isolation
        run: python3 scripts/verify_variants.py
      - uses: actions/upload-artifact@v4
        with:
          name: debug-apks
          path: app/build/outputs/apk/**/debug/*.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: '**/build/reports/'
